worker_processes 1;

events {
    worker_connections 512;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen 80;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # Rotas da API do backend (FastAPI) — mesmos nomes dos routers em
        # backend/app/main.py. Tudo que não bater aqui cai no SPA abaixo.
        # ATENCAO: cada novo router precisa ser adicionado aqui manualmente -
        # ja esquecemos uma vez (fornecedores/despesas) e isso derrubou POST/
        # DELETE com 405 mesmo com o backend respondendo certo por tras.
        location ~ ^/(auth|usuarios|unidades|veiculos|fornecedores|despesas|despesas-recorrentes|transparencia|tickets|avisos-mural|avisos-diretos|ocorrencias|reunioes|entregas|notificacoes|visitantes|areas-comuns|reservas|contato|predios|health|docs|redoc|openapi\.json)(/|$) {
            proxy_pass         http://meupredio_backend:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # SPA: qualquer outro caminho serve o index.html (roteamento client-side
        # do react-router cuida do resto).
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
