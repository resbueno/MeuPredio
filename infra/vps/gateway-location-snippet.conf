# Bloco a inserir no server{} HTTPS de ~/gateway/nginx.conf (na VPS), ANTES
# do "location = /" e do "location /" catch-all que hoje mandam tudo para o
# SIGA — nginx escolhe o prefixo mais específico independente da ordem, mas
# manter isso legível para quem for ler o arquivo depois importa mais.
#
# Backup do arquivo original antes de editar, testar com
# `docker exec gateway_nginx nginx -t` e só then reload (nunca restart) —
# ver infra/vps/README.md.

        # ── /meupredio — MeuPredio (Fase 1, homologação) ────────────────
        location = /meupredio { return 301 /meupredio/; }
        location /meupredio/ {
            limit_req zone=gw burst=120 nodelay;
            rewrite ^/meupredio/(.*)$ /$1 break;
            proxy_pass         http://meupredio_nginx:80;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
