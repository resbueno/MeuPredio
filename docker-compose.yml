services:
  db:
    image: postgres:16-alpine
    container_name: meupredio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meupredio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque-esta-senha-local}
      POSTGRES_DB: ${POSTGRES_DB:-meupredio}
      POSTGRES_DB_TEST: ${POSTGRES_DB_TEST:-meupredio_test}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meupredio} -d ${POSTGRES_DB:-meupredio}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
